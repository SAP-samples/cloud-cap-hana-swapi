<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Wars Launchpad</title>

    <script>
        window['sap-ushell-config'] = {
            defaultRenderer: 'fiori2',
            applications: {
                'star-wars-people-Display': {
                    additionalInformation: 'SAPUI5.Component=star.wars.people',
                    applicationType: 'URL',
                    url: './people/webapp/',
                    navigationMode: 'embedded'
                },
                'star-wars-media-Display': {
                    additionalInformation: 'SAPUI5.Component=star.wars.media',
                    applicationType: 'URL',
                    url: './media/webapp/',
                    navigationMode: 'embedded'
                },
                'star-wars-film-Display': {
                    additionalInformation: 'SAPUI5.Component=star.wars.film',
                    applicationType: 'URL',
                    url: './film/webapp/',
                    navigationMode: 'embedded'
                },
                'star-wars-show-Display': {
                    additionalInformation: 'SAPUI5.Component=star.wars.show',
                    applicationType: 'URL',
                    url: './show/webapp/',
                    navigationMode: 'embedded'
                }
            },
            services: {
                LaunchPage: {
                    adapter: {
                        config: {
                            groups: [
                                {
                                    id: 'group-starwars',
                                    title: 'Star Wars Apps',
                                    isPreset: true,
                                    isVisible: true,
                                    tiles: [
                                        {
                                            id: 'tile-people',
                                            tileType: 'sap.ushell.ui.tile.StaticTile',
                                            properties: {
                                                title: 'Star Wars People',
                                                subtitle: 'People Maintenance',
                                                icon: 'sap-icon://person-placeholder',
                                                targetURL: '#star-wars-people-Display'
                                            }
                                        },
                                        {
                                            id: 'tile-media',
                                            tileType: 'sap.ushell.ui.tile.StaticTile',
                                            properties: {
                                                title: 'Star Wars Media',
                                                subtitle: 'Media Browser',
                                                icon: 'sap-icon://media-play',
                                                targetURL: '#star-wars-media-Display'
                                            }
                                        },
                                        {
                                            id: 'tile-film',
                                            tileType: 'sap.ushell.ui.tile.StaticTile',
                                            properties: {
                                                title: 'Star Wars Films',
                                                subtitle: 'Film Details',
                                                icon: 'sap-icon://cinema',
                                                targetURL: '#star-wars-film-Display'
                                            }
                                        },
                                        {
                                            id: 'tile-show',
                                            tileType: 'sap.ushell.ui.tile.StaticTile',
                                            properties: {
                                                title: 'Star Wars Shows',
                                                subtitle: 'Show Details',
                                                icon: 'sap-icon://tv-show',
                                                targetURL: '#star-wars-show-Display'
                                            }
                                        }
                                    ]
                                }
                            ]
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://ui5.sap.com/1.141.3/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
    <script
        src="https://ui5.sap.com/1.141.3/resources/sap-ui-core.js"
        id="sap-ui-bootstrap"
        data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-frameOptions="allow"
        data-sapui-bindingSyntax="complex"
        data-sap-ui-async="true"
    ></script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ushell.Container.createRenderer("fiori2", true).then(function (oRenderer) {
                oRenderer.placeAt('content')
            })
        })
    </script>
</head>

<body id="content" class="sapUiBody" role="application">
</body>
</html>
